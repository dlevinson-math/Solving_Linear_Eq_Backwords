<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solve Linear Equations Backwards</title>
  <style>
    :root{
      --bg:#f7f7f5;
      --panel:#ffffff;
      --card:#fbfbfa;
      --text:#161616;
      --muted:#6b6b6b;
      --border:#d9d9d4;
      --accent:#1f5eff;
      --accent-soft:#eef3ff;
      --success:#138a4b;
      --shadow:0 1px 2px rgba(0,0,0,.04);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app{
      width:min(1180px, 100%);
      margin:0 auto;
      padding:18px;
    }
    .toolbar{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto auto;
      gap:12px;
      align-items:end;
      margin-bottom:16px;
    }
    label{display:block}
    .label{
      display:block;
      font-size:14px;
      font-weight:800;
      margin-bottom:7px;
    }
    input{
      width:100%;
      min-height:72px;
      border:2px solid var(--border);
      border-radius:14px;
      background:var(--panel);
      padding:0 16px;
      font-size:24px;
      font-weight:750;
      color:var(--text);
      outline:none;
    }
    input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(31,94,255,.12);
    }
    button{
      min-height:72px;
      border-radius:14px;
      border:2px solid var(--border);
      background:var(--panel);
      color:var(--text);
      padding:0 20px;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
    }
    button:hover{background:#f2f2ef}
    button.primary{
      background:var(--accent-soft);
      border-color:var(--accent);
    }
    button:disabled{
      cursor:default;
      opacity:.45;
    }

    .pretty-equation{
      min-height:108px;
      margin:0 0 16px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px 18px;
      border:2px solid var(--border);
      border-radius:16px;
      background:var(--panel);
      font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;
      font-size:clamp(48px,6vw,76px);
      font-weight:500;
      line-height:1.05;
      overflow:hidden;
    }
    .math-expr{
      display:inline-flex;
      align-items:center;
      gap:.12em;
      white-space:nowrap;
    }
    .math-op{
      display:inline-block;
      margin:0 .08em;
    }
    .math-paren{
      display:inline-block;
      font-size:1.08em;
      line-height:1;
    }
    .math-frac{
      display:inline-grid;
      grid-template-rows:auto auto;
      align-items:center;
      justify-items:center;
      vertical-align:middle;
      line-height:1;
      margin:0 .08em;
      min-width:1.2em;
    }
    .math-frac-num{
      width:100%;
      text-align:center;
      border-bottom:2px solid currentColor;
      padding:0 .16em .09em;
    }
    .math-frac-den{
      width:100%;
      text-align:center;
      padding:.09em .16em 0;
    }
    .math-error{
      color:var(--muted);
      font-family:Inter,ui-sans-serif,system-ui,sans-serif;
      font-size:18px;
      font-weight:700;
    }
    .message{
      display:none;
      margin:0 0 14px;
      border:2px solid var(--border);
      background:var(--card);
      border-radius:12px;
      padding:11px 13px;
      font-size:15px;
    }
    .message.show{display:block}
    .panel{
      background:var(--card);
      border:2px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }
    .panel-head{
      display:flex;
      gap:16px;
      align-items:flex-start;
      justify-content:space-between;
      margin-bottom:14px;
    }
    .kicker{
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:var(--muted);
      font-weight:900;
      margin-bottom:4px;
    }
    h2{
      margin:0;
      font-size:23px;
      line-height:1.2;
    }
    .chain{
      display:flex;
      align-items:center;
      gap:6px;
      width:100%;
      min-height:72px;
      overflow:visible;
      padding:5px 0 7px;
    }
    .node{
      flex:1 1 0;
      min-width:0;
      min-height:58px;
      border:3px solid var(--border);
      border-radius:14px;
      background:var(--panel);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px 8px;
      font-size:clamp(20px, 2.2vw, 30px);
      font-weight:900;
      text-align:center;
      white-space:nowrap;
    }
    .node.end{border-color:var(--success)}
    .opwrap{
      flex:1 1 0;
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
    }
    .op{
      flex:1 1 auto;
      min-width:0;
      border-radius:999px;
      background:#f4edc9;
      border:2px solid #d8c98a;
      padding:7px 8px;
      text-align:center;
      font-size:clamp(16px, 1.7vw, 22px);
      font-weight:850;
      white-space:nowrap;
    }
    .arrow{
      flex:0 0 auto;
      font-size:clamp(20px, 2vw, 28px);
      line-height:1;
      font-weight:900;
      color:var(--muted);
    }
    .ghost{opacity:.17}
    .solution{
      display:none;
      margin-top:14px;
      border:3px solid var(--accent);
      background:var(--accent-soft);
      border-radius:16px;
      padding:13px 16px;
      text-align:center;
    }
    .solution.show{display:block}
    .solution-label{
      font-size:13px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.1em;
    }
    .solution-text{
      font-size:38px;
      font-weight:950;
    }
    .compact-head{
      margin-bottom:6px;
    }
    .process-grid{
      display:grid;
      grid-template-columns:108px minmax(0,1fr);
      column-gap:10px;
      row-gap:2px;
      align-items:center;
    }
    .row-label{
      font-size:14px;
      font-weight:900;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .backward-label{
      color:var(--accent);
    }
    .answer-control{
      min-width:0;
    }
    .show-answer-btn{
      min-height:50px;
      padding:0 18px;
      font-size:17px;
    }
    .hidden-answer{
      display:none !important;
    }
    .backward-chain{
      justify-content:flex-start;
    }
    .footer-note{
      color:var(--muted);
      font-size:13px;
      margin-top:4px;
    }

    @media (max-width: 800px){
      .process-grid{
        grid-template-columns:1fr;
        row-gap:6px;
      }
      .row-label{
        margin-top:4px;
      }

      .toolbar{
        grid-template-columns:1fr 1fr;
      }
      .toolbar label{grid-column:1/-1}
      .panel-head{
        flex-direction:column;
      }
      .node{font-size:34px;min-width:64px}
      .op{font-size:18px;min-width:58px}
      h2{font-size:20px}
    }

    @media print{
      body{background:#fff}
      .toolbar,.actions,.footer-note{display:none!important}
      .app{width:100%;padding:0}
      .panel{break-inside:avoid}
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="toolbar">
      <label>
        <span class="label">Equation</span>
        <input id="eqInput" value="3(x + 2) - 4 = 17" aria-label="Linear equation" />
      </label>
      <button id="solveBtn" class="primary" type="button">Show process</button>
      <button id="randomBtn" type="button">Random</button>
    </div>

    <div id="prettyEquation" class="pretty-equation" aria-live="polite" aria-label="Rendered equation"></div>

    <div id="message" class="message" role="alert"></div>

    <section class="panel">
      <div class="panel-head compact-head">
        <div>
          <div class="kicker">1 · Forward</div>
          <h2>What happens to x?</h2>
        </div>
      </div>

      <div class="process-grid">
        <div class="row-label">Forward</div>
        <div id="forwardChain" class="chain" aria-label="Forward operation chain"></div>

        <div class="answer-control"></div>
        <div class="answer-control">
          <button id="showAnswerBtn" class="primary show-answer-btn" type="button">Show answer</button>
        </div>

        <div id="backwardLabel" class="row-label backward-label hidden-answer">Work backwards</div>
        <div id="backChain" class="chain backward-chain hidden-answer" aria-live="polite" aria-label="Backward solution chain"></div>
      </div>

      <div id="solutionBox" class="solution hidden-answer">
        <div class="solution-label">Solution</div>
        <div id="solutionText" class="solution-text"></div>
      </div>
    </section>

    <div class="footer-note">
      Best for equations built as a single chain around x, such as 3(x + 2) − 4 = 17.
    </div>
  </main>

  <script>
  (() => {
    const input = document.getElementById('eqInput');
    const solveBtn = document.getElementById('solveBtn');
    const randomBtn = document.getElementById('randomBtn');
    const forward = document.getElementById('forwardChain');
    const back = document.getElementById('backChain');
    const message = document.getElementById('message');
    const prettyEquation = document.getElementById('prettyEquation');
    const solutionBox = document.getElementById('solutionBox');
    const solutionText = document.getElementById('solutionText');
    const showAnswerBtn = document.getElementById('showAnswerBtn');
    const backwardLabel = document.getElementById('backwardLabel');

    let state = null;

    function fmt(n) {
      if (Math.abs(n) < 1e-10) n = 0;
      if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
      return String(Math.round(n * 1000) / 1000);
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'
      }[c]));
    }


    function nodePrec(n) {
      if (n.k === 'n' || n.k === 'x') return 4;
      if (n.k === 'neg') return 3;
      if (n.o === '*' || n.o === '/') return 2;
      return 1;
    }

    function renderMathNode(n, parentPrec = 0) {
      if (n.k === 'n') return esc(fmt(n.v));
      if (n.k === 'x') return 'x';

      if (n.k === 'neg') {
        const child = renderMathNode(n.a, 3);
        const wrapped = nodePrec(n.a) < 3
          ? `<span class="math-paren">(</span>${child}<span class="math-paren">)</span>`
          : child;
        return `−${wrapped}`;
      }

      if (n.o === '/') {
        return `<span class="math-frac"><span class="math-frac-num">${renderMathNode(n.a, 0)}</span><span class="math-frac-den">${renderMathNode(n.b, 0)}</span></span>`;
      }

      const prec = nodePrec(n);
      let left = renderMathNode(n.a, prec);
      let right = renderMathNode(n.b, prec);

      if (nodePrec(n.a) < prec) {
        left = `<span class="math-paren">(</span>${left}<span class="math-paren">)</span>`;
      }

      if (nodePrec(n.b) < prec || (n.o === '-' && nodePrec(n.b) <= prec)) {
        right = `<span class="math-paren">(</span>${right}<span class="math-paren">)</span>`;
      }

      const op =
        n.o === '+' ? '<span class="math-op">+</span>' :
        n.o === '-' ? '<span class="math-op">−</span>' :
        '<span class="math-op">·</span>';

      const body = `<span class="math-expr">${left}${op}${right}</span>`;
      return prec < parentPrec
        ? `<span class="math-paren">(</span>${body}<span class="math-paren">)</span>`
        : body;
    }

    function renderPrettyEquation(text) {
      try {
        const parts = text.split('=');
        if (parts.length !== 2) throw Error('invalid');
        const left = parseExpr(parts[0]);
        const right = parseExpr(parts[1]);
        prettyEquation.innerHTML =
          `<span class="math-expr">${renderMathNode(left)}<span class="math-op">=</span>${renderMathNode(right)}</span>`;
      } catch {
        prettyEquation.innerHTML = '<span class="math-error">Type an equation to preview it here.</span>';
      }
    }

    function showError(text) {
      message.textContent = text;
      message.classList.add('show');
    }

    function clearError() {
      message.textContent = '';
      message.classList.remove('show');
    }

    function tokenize(s) {
      s = s
        .replace(/[−–—]/g, '-')
        .replace(/[×·]/g, '*')
        .replace(/÷/g, '/')
        .replace(/\s+/g, '');

      const raw = [];
      let i = 0;

      while (i < s.length) {
        const c = s[i];

        if (/[0-9.]/.test(c)) {
          let j = i + 1;
          while (j < s.length && /[0-9.]/.test(s[j])) j++;
          const v = Number(s.slice(i, j));
          if (!Number.isFinite(v)) throw Error('Check the numbers in the equation.');
          raw.push({ t: 'num', v });
          i = j;
        } else if (c.toLowerCase() === 'x') {
          raw.push({ t: 'x' });
          i++;
        } else if ('+-*/()'.includes(c)) {
          raw.push({ t: c });
          i++;
        } else {
          throw Error('Use x, numbers, +, −, ×, ÷, and parentheses.');
        }
      }

      const out = [];
      const ends = a => a && (a.t === 'num' || a.t === 'x' || a.t === ')');
      const starts = a => a && (a.t === 'num' || a.t === 'x' || a.t === '(');

      for (const tok of raw) {
        if (ends(out[out.length - 1]) && starts(tok)) out.push({ t: '*' });
        out.push(tok);
      }

      return out;
    }

    function parseExpr(text) {
      const ts = tokenize(text);
      let p = 0;

      const peek = () => ts[p];
      const take = () => ts[p++];

      function primary() {
        const t = peek();
        if (!t) throw Error('The equation is incomplete.');

        if (t.t === 'num') {
          take();
          return { k: 'n', v: t.v };
        }

        if (t.t === 'x') {
          take();
          return { k: 'x' };
        }

        if (t.t === '(') {
          take();
          const n = add();
          if (!peek() || take().t !== ')') throw Error('Check the parentheses.');
          return n;
        }

        if (t.t === '+' || t.t === '-') {
          take();
          const n = primary();
          return t.t === '+' ? n : { k: 'neg', a: n };
        }

        throw Error('I could not read that expression.');
      }

      function mul() {
        let n = primary();
        while (peek() && (peek().t === '*' || peek().t === '/')) {
          const o = take().t;
          n = { k: 'b', o, a: n, b: primary() };
        }
        return n;
      }

      function add() {
        let n = mul();
        while (peek() && (peek().t === '+' || peek().t === '-')) {
          const o = take().t;
          n = { k: 'b', o, a: n, b: mul() };
        }
        return n;
      }

      const n = add();
      if (p !== ts.length) throw Error('I could not read the whole expression.');
      return n;
    }

    function xcount(n) {
      return n.k === 'x'
        ? 1
        : n.k === 'n'
          ? 0
          : n.k === 'neg'
            ? xcount(n.a)
            : xcount(n.a) + xcount(n.b);
    }

    function constant(n) {
      if (xcount(n)) throw Error('Expected a number.');

      if (n.k === 'n') return n.v;
      if (n.k === 'neg') return -constant(n.a);

      const a = constant(n.a);
      const b = constant(n.b);

      if (n.o === '+') return a + b;
      if (n.o === '-') return a - b;
      if (n.o === '*') return a * b;

      if (Math.abs(b) < 1e-12) throw Error('Division by zero is not allowed.');
      return a / b;
    }

    function opsFrom(n) {
      if (n.k === 'x') return [];

      if (n.k === 'neg') {
        const q = opsFrom(n.a);
        q.push({ t: 'mul', n: -1 });
        return q;
      }

      if (n.k !== 'b') throw Error('The left side needs one x.');

      const lx = xcount(n.a);
      const rx = xcount(n.b);

      if (lx + rx !== 1) {
        throw Error('For this working-backwards model, use one chain around x, such as 3(x + 2) − 4 = 17.');
      }

      if (lx) {
        const q = opsFrom(n.a);
        const c = constant(n.b);

        if (n.o === '+') q.push({ t: 'add', n: c });
        else if (n.o === '-') q.push({ t: 'add', n: -c });
        else if (n.o === '*') {
          if (Math.abs(c) < 1e-12) throw Error('Multiplying x by 0 does not give one unique solution.');
          q.push({ t: 'mul', n: c });
        } else {
          if (Math.abs(c) < 1e-12) throw Error('Division by zero is not allowed.');
          q.push({ t: 'div', n: c });
        }

        return q;
      }

      const q = opsFrom(n.b);
      const c = constant(n.a);

      if (n.o === '+') q.push({ t: 'add', n: c });
      else if (n.o === '*') {
        if (Math.abs(c) < 1e-12) throw Error('Multiplying x by 0 does not give one unique solution.');
        q.push({ t: 'mul', n: c });
      } else if (n.o === '-') {
        q.push({ t: 'mul', n: -1 });
        q.push({ t: 'add', n: c });
      } else {
        throw Error('An expression like a ÷ x is not linear.');
      }

      return q;
    }

    function apply(v, o) {
      return o.t === 'add' ? v + o.n : o.t === 'mul' ? v * o.n : v / o.n;
    }

    function inverse(o) {
      return o.t === 'add'
        ? { t: 'add', n: -o.n }
        : o.t === 'mul'
          ? { t: 'div', n: o.n }
          : { t: 'mul', n: o.n };
    }

    function label(o) {
      if (o.t === 'add') return o.n >= 0 ? '+ ' + fmt(o.n) : '− ' + fmt(Math.abs(o.n));
      if (o.t === 'mul') return '× ' + fmt(o.n);
      return '÷ ' + fmt(o.n);
    }

    function parseEquation(s) {
      const parts = s.split('=');

      if (parts.length !== 2) {
        throw Error('Enter one equation with exactly one = sign.');
      }

      const left = parseExpr(parts[0]);
      const right = parseExpr(parts[1]);

      if (xcount(right)) {
        throw Error('For this visualizer, put x on the left and a number on the right.');
      }

      if (xcount(left) !== 1) {
        throw Error('The left side needs exactly one x-chain.');
      }

      const rhs = constant(right);
      const ops = opsFrom(left);

      let v = rhs;
      const inv = ops.slice().reverse().map(inverse);
      const vals = [rhs];

      for (const o of inv) {
        v = apply(v, o);
        if (!Number.isFinite(v)) throw Error('This equation does not produce a usable solution.');
        vals.push(v);
      }

      if (Math.abs(v) > 1e6) {
        throw Error('Try a simpler equation with smaller numbers.');
      }

      return {
        text: s.trim(),
        rhs,
        ops,
        inv,
        vals,
        solution: v
      };
    }

    function node(text, end = false, ghost = false) {
      return `<div class="node${end ? ' end' : ''}${ghost ? ' ghost' : ''}">${esc(text)}</div>`;
    }

    function step(op, ghost = false, direction = 'right') {
      const arrow = direction === 'left' ? '←' : '→';
      return `<div class="opwrap${ghost ? ' ghost' : ''}">
        <span class="arrow">${arrow}</span>
        <span class="op">${esc(label(op))}</span>
      </div>`;
    }

    function render() {
      if (!state) return;

      let f = node('x');
      state.ops.forEach(o => {
        f += step(o, false, 'right');
      });
      f += `<span class="arrow">→</span>${node(fmt(state.rhs), true)}`;
      forward.innerHTML = f;

      // Build the inverse process from the result back to x.
      // DOM order remains left-to-right for readability; arrows point left.
      let values = [state.rhs];
      let v = state.rhs;
      for (const o of state.inv) {
        v = apply(v, o);
        values.push(v);
      }

      let b = node(fmt(values[values.length - 1]), false);
      for (let i = state.inv.length - 1; i >= 0; i--) {
        b += step(state.inv[i], false, 'left');
        b += `<span class="arrow">←</span>${node(fmt(values[i]), i === 0)}`;
      }
      back.innerHTML = b;

      solutionText.textContent = 'x = ' + fmt(state.solution);
    }

    function solve() {
      try {
        clearError();
        state = parseEquation(input.value);
        renderPrettyEquation(input.value);
        render();
        back.classList.add('hidden-answer');
        backwardLabel.classList.add('hidden-answer');
        solutionBox.classList.add('hidden-answer');
        showAnswerBtn.textContent = 'Show answer';
        showAnswerBtn.dataset.shown = 'false';
      } catch (e) {
        showError(e.message);
      }
    }

    function expressionFromOps(ops) {
      let e = 'x';
      let prec = 3;

      for (const o of ops) {
        if (o.t === 'add') {
          e += o.n >= 0 ? ' + ' + fmt(o.n) : ' − ' + fmt(Math.abs(o.n));
          prec = 1;
        } else if (o.t === 'mul') {
          if (prec < 2) e = '(' + e + ')';
          e += ' × ' + fmt(o.n);
          prec = 2;
        } else {
          if (prec < 2) e = '(' + e + ')';
          e += ' ÷ ' + fmt(o.n);
          prec = 2;
        }
      }

      return e;
    }

    function rand(a, b) {
      return Math.floor(Math.random() * (b - a + 1)) + a;
    }

    function randomEquation() {
      let x = rand(-7, 8);
      if (x === 0 && Math.random() < 0.6) x = rand(1, 7);

      let cur = x;
      const ops = [];
      const count = rand(2, 4);

      for (let i = 0; i < count; i++) {
        const choices = ['add', 'add', 'mul'];

        for (const d of [2, 3, 4]) {
          if (Number.isInteger(cur / d)) choices.push('div');
        }

        const t = choices[rand(0, choices.length - 1)];
        let o;

        if (t === 'add') {
          let n = rand(-7, 7);
          if (n === 0) n = 3;
          o = { t: 'add', n };
        } else if (t === 'mul') {
          o = { t: 'mul', n: rand(2, 4) };
        } else {
          const ds = [2, 3, 4].filter(d => Number.isInteger(cur / d));
          o = ds.length
            ? { t: 'div', n: ds[rand(0, ds.length - 1)] }
            : { t: 'add', n: rand(1, 6) };
        }

        const next = apply(cur, o);

        if (Math.abs(next) > 60) {
          o = { t: 'add', n: cur > 0 ? -rand(2, 6) : rand(2, 6) };
        }

        cur = apply(cur, o);
        ops.push(o);
      }

      input.value = expressionFromOps(ops) + ' = ' + fmt(cur);
      solve();
    }

    solveBtn.addEventListener('click', solve);
    randomBtn.addEventListener('click', randomEquation);

    showAnswerBtn.addEventListener('click', () => {
      const shown = showAnswerBtn.dataset.shown === 'true';

      if (shown) {
        back.classList.add('hidden-answer');
        backwardLabel.classList.add('hidden-answer');
        solutionBox.classList.add('hidden-answer');
        showAnswerBtn.textContent = 'Show answer';
        showAnswerBtn.dataset.shown = 'false';
      } else {
        back.classList.remove('hidden-answer');
        backwardLabel.classList.remove('hidden-answer');
        solutionBox.classList.remove('hidden-answer');
        showAnswerBtn.textContent = 'Hide answer';
        showAnswerBtn.dataset.shown = 'true';
      }
    });

    input.addEventListener('input', () => renderPrettyEquation(input.value));

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        solve();
      }
    });

    renderPrettyEquation(input.value);
    solve();
  })();
  </script>
</body>
</html>
